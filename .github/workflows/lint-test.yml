name: Lint and test charts

on:
  pull_request:
    paths:
    - charts/**
    - .github/workflows/lint-test.yml
  push:
    branches:
    - main
    paths:
    - charts/**
    - .github/workflows/lint-test.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kubernetes-version:
        - 1.30.0
        - 1.34.0
    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0

    - name: Set up Helm
      uses: azure/setup-helm@v5.0.1

    - name: Set up Python
      uses: actions/setup-python@v7.0.0
      with:
        python-version: "3.13"

    - name: Set up chart-testing
      uses: helm/chart-testing-action@v2.8.0

    - name: Lint charts
      run: ct lint --charts charts/laravel-app,charts/node-app,charts/uptime-operator,charts/paperless-ngx

    - name: Install helm-unittest
      # Helm 4 does not support GPG verification for legacy plugin archives.
      run: helm plugin install https://github.com/helm-unittest/helm-unittest/releases/download/v1.1.2/unittest-1.1.2.tgz --verify=false

    - name: Run unit tests
      run: |
        helm unittest charts/laravel-app
        helm unittest charts/node-app
        helm unittest charts/uptime-operator
        helm unittest charts/paperless-ngx

    - name: Render smoke-test manifests
      run: |
        helm template smoke charts/laravel-app > rendered-default.yaml
        helm template smoke charts/laravel-app \
          --values charts/laravel-app/values.test.yaml \
          > rendered-features.yaml
        helm template smoke charts/laravel-app \
          --set app.migrate.mode=hook \
          > rendered-migrate-hook.yaml
        helm template smoke charts/node-app > rendered-node-default.yaml
        helm template smoke charts/node-app \
          --values charts/node-app/values.test.yaml \
          > rendered-node-features.yaml
        helm template smoke charts/uptime-operator > rendered-uptime-default.yaml
        helm template smoke charts/uptime-operator \
          --values charts/uptime-operator/values.test.yaml \
          > rendered-uptime-features.yaml
        helm template smoke charts/paperless-ngx > rendered-paperless-default.yaml
        helm template smoke charts/paperless-ngx \
          --values charts/paperless-ngx/values.test.yaml \
          > rendered-paperless-features.yaml

    - name: Validate Kubernetes manifests
      run: |
        docker run --rm \
          --volume "$PWD:/work" \
          ghcr.io/yannh/kubeconform:v0.8.0 \
          -strict \
          -summary \
          -ignore-missing-schemas \
          -kubernetes-version "${{ matrix.kubernetes-version }}" \
          /work/rendered-default.yaml \
          /work/rendered-features.yaml \
          /work/rendered-migrate-hook.yaml \
          /work/rendered-node-default.yaml \
          /work/rendered-node-features.yaml \
          /work/rendered-uptime-default.yaml \
          /work/rendered-uptime-features.yaml \
          /work/rendered-paperless-default.yaml \
          /work/rendered-paperless-features.yaml
