suite: deployment
templates:
  - templates/deployment.yaml
  - templates/configmap.yaml
  - templates/configmap-static-monitors.yaml
tests:
  - it: renders restricted security defaults
    template: templates/deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.strategy.type
          value: Recreate
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: true
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 65532
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL
  - it: uses the chart appVersion when image.tag is empty
    template: templates/deployment.yaml
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: ^ghcr.io/solid3dlab/uptime-operator:.+$
  - it: injects Kuma credentials from the existing secret
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].configMapRef.name
          value: RELEASE-NAME-uptime-operator-config
      - equal:
          path: spec.template.spec.containers[0].env[0].name
          value: KUMA_URL
      - equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.name
          value: uptime-operator
      - equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.key
          value: url
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /config
  - it: honors a custom image tag and created secret
    template: templates/deployment.yaml
    set:
      image.tag: 0.3.0
      existingSecret: ""
      secret.create: true
      secret.url: https://kuma.example.com
      secret.username: operator
      secret.password: secret
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/solid3dlab/uptime-operator:0.3.0
      - equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.name
          value: RELEASE-NAME-uptime-operator
  - it: sets GOMEMLIMIT when requested
    template: templates/deployment.yaml
    set:
      gomemlimit: 58MiB
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
            value: 58MiB
