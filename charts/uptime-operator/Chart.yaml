apiVersion: v2
name: uptime-operator
description: Sync annotated HTTPRoutes and Ingresses into Uptime Kuma HTTP monitors
home: https://github.com/okaufmann/helm-charts/tree/main/charts/uptime-operator
sources:
- https://github.com/okaufmann/helm-charts
- https://github.com/solid3dlab/uptime-operator
maintainers:
- name: okaufmann
  url: https://github.com/okaufmann
kubeVersion: ">=1.25.0-0"
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: config.managedTag sets MANAGED_TAG so clusters on a shared Kuma keep separate monitors.
    - kind: changed
      description: Operator 0.7.0 reads HTTPRoutes and only adopts monitors that carry no tag.
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: Operator source
      url: https://github.com/solid3dlab/uptime-operator
    - name: Uptime Kuma
      url: https://github.com/louislam/uptime-kuma
type: application
version: "1.2.0"
# renovate: datasource=github-releases depName=solid3dlab/uptime-operator extractVersion=^v(?<version>.*)$
appVersion: "0.7.0"
