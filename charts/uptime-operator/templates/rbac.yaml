{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "uptime-operator.fullname" . }}
  labels:
    {{- include "uptime-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "uptime-operator.fullname" . }}
  labels:
    {{- include "uptime-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "uptime-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "uptime-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
