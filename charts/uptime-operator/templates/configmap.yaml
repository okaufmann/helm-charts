apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "uptime-operator.configMapName" . }}
  labels:
    {{- include "uptime-operator.labels" . | nindent 4 }}
data:
  RESYNC_INTERVAL: {{ .Values.config.resyncInterval | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  STATIC_MONITORS_PATH: {{ .Values.config.staticMonitorsPath | quote }}
  DEFAULT_DELETE_POLICY: {{ .Values.config.defaultDeletePolicy | quote }}
  DEFAULT_DELETE_GRACE: {{ .Values.config.defaultDeleteGrace | quote }}
  {{- range $key, $value := .Values.extraEnv }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
