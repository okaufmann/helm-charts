suite: service and ingress
templates:
- templates/service.yaml
- templates/ingress.yaml
- templates/pdb.yaml
- templates/hpa.yaml
tests:
- it: names the service after the fullname
  template: templates/service.yaml
  set:
    fullnameOverride: solid3d-web
  asserts:
  - equal:
      path: metadata.name
      value: solid3d-web
- it: renders ingress when enabled
  template: templates/ingress.yaml
  set:
    app.ingress.enabled: true
    app.ingress.ingressClassName: nginx-external
    app.ingress.hosts:
    - host: next.solid3d.ch
      paths:
      - /
  asserts:
  - isKind:
      of: Ingress
  - equal:
      path: spec.rules[0].host
      value: next.solid3d.ch
  - equal:
      path: spec.rules[0].http.paths[0].pathType
      value: Prefix
- it: renders a PDB when enabled
  template: templates/pdb.yaml
  set:
    app.podDisruptionBudget.enabled: true
  asserts:
  - isKind:
      of: PodDisruptionBudget
  - equal:
      path: spec.minAvailable
      value: 1
- it: renders HPA when enabled
  template: templates/hpa.yaml
  set:
    app.autoscaling.enabled: true
  asserts:
  - isKind:
      of: HorizontalPodAutoscaler
  - equal:
      path: spec.minReplicas
      value: 1
