{{- if and .Values.app.enabled .Values.app.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "node-app.fullname" . }}
  labels:
    {{- include "node-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  {{- if ne .Values.app.podDisruptionBudget.maxUnavailable nil }}
  maxUnavailable: {{ .Values.app.podDisruptionBudget.maxUnavailable }}
  {{- else }}
  minAvailable: {{ .Values.app.podDisruptionBudget.minAvailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "node-app.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: app
{{- end }}
