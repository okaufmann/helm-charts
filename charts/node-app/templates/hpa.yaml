{{- if and .Values.app.enabled .Values.app.autoscaling.enabled }}
{{- if not (or .Values.app.autoscaling.targetCPUUtilizationPercentage .Values.app.autoscaling.targetMemoryUtilizationPercentage) -}}
{{- fail "app.autoscaling requires at least one CPU or memory utilization target" -}}
{{- end }}
{{- if gt (int .Values.app.autoscaling.minReplicas) (int .Values.app.autoscaling.maxReplicas) -}}
{{- fail "app.autoscaling.minReplicas must not exceed maxReplicas" -}}
{{- end }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "node-app.fullname" . }}
  labels:
    {{- include "node-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "node-app.fullname" . }}
  minReplicas: {{ .Values.app.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.app.autoscaling.maxReplicas }}
  metrics:
    {{- with .Values.app.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ . }}
    {{- end }}
    {{- with .Values.app.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ . }}
    {{- end }}
  {{- with .Values.app.autoscaling.behavior }}
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
