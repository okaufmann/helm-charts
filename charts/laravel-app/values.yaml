global: {}

# Existing Secret whose keys are exposed as environment variables to the app,
# queue, scheduler, and their init/migration containers.
existingEnvSecret: ""

imagePullSecrets:
- name: regcred

securityContext: {}

serviceAccount:
  # Specifies whether a ServiceAccount should be created
  create: false
  # The name of the ServiceAccount to use. If not set and create is true, a name is generated using the fullname template
  name: ""
  # Additional annotations for the ServiceAccount
  annotations: {}

meiliMasterKey: ""

# ensure meilisearch.auth.existingMasterKeySecret is set to this exact same value!
meiliMasterKeySecretName: "meilisearch-master-key"

metrics:
  enabled: true

webRoot: "/var/www/html"

statamic:
  enabled: false

  # this is the repo for the content for the app. as we only map the content folders, we can also use the same repo as the app repo itself.
  repo:
    sshUrl: "git@github.com:org/repository.git"
    # Existing Secret with `id_key` and `known_hosts` keys. When set, the chart
    # does not render SSH credentials from Helm values.
    existingSecret: ""
    sshPrivateKey: ""
    knownHosts: ""

  git:
    user: "statamic"
    email: "statamic@example.com"
    message: "Update from production [ci skip]"
    push: true

  schedule: "*/10 * * * *"

  persistence:
    accessMode: "ReadWriteOnce"
    size: "10Gi"
    storageClass: ""

app:
  enabled: true

  image:
    repository: serversideup/php
    pullPolicy: Always
    tag: "8.5-fpm-nginx"

  replicaCount: 1

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate

  nodeSelector: {}

  tolerations: []

  podAnnotations: {}

  podSecurityContext: {}

  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 200M
  # requests:
  #   cpu: 50m
  #   memory: 100M

  # Extra volumes to mount on the container.
  extraVolumeMounts: []
  # - name: my-extra-volume
  #   mountPath: /path/in/container

  extraVolumes: []
  # - name: my-extra-volume
  #   emptyDir: {}

  affinity: {}
  #     podAntiAffinity:
  #       preferredDuringSchedulingIgnoredDuringExecution:
  #         - podAffinityTerm:
  #             labelSelector:
  #               matchExpressions:
  #                 - key: role
  #                   operator: In
  #                   values:
  #                     - backend
  #             topologyKey: kubernetes.io/hostname
  #           weight: 100

  # run caching commands that will cache things like views and config files into bootstrap/cache (thats the only folder that is shared between all pods)
  initCommands:
  - php artisan optimize
  - php artisan view:cache

  command:

  # Run the application with Laravel Octane. app.command takes precedence when set.
  octane:
    enabled: false
    server: frankenphp
    host: 0.0.0.0
    port: 8080
    maxRequests: 500
    # Leave empty to let Octane choose the worker count.
    workers: ""
    livenessProbe:
      httpGet:
        path: /up
        port: http
      initialDelaySeconds: 15
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 5
    readinessProbe:
      httpGet:
        path: /up
        port: http
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 5

  migrate:
    enabled: true
    command: "php artisan migrate --isolated --force"

  service:
    type: ClusterIP # Default service type.
    port: 80 # Default port the service listens on.
    targetPort: 80 # Default port the pods are exposing.
    nodePort: "" # For when service.type is NodePort.
    annotations: {} # Annotations to add to the service.
    labels: {} # Additional labels to add to the service.
    externalTrafficPolicy: Cluster # Can be set to Local to preserve source IP, or Cluster for default behavior.
    loadBalancerIP: "" # To set a specific IP for a LoadBalancer type service.
    loadBalancerSourceRanges: [] # IP whitelist for LoadBalancers.

  serviceMonitor:
    enabled: false

  livenessProbe:
    failureThreshold: 5
    initialDelaySeconds: 60
    periodSeconds: 15
    timeoutSeconds: 30
    httpGet:
      path: /health
      port: 80

  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 10
    httpGet:
      path: /health
      port: 80

  ingress:
    enabled: false # By default, do not create an ingress.
    ingressClassName: "" # Set to the name of the ingress class to use annotations.
    annotations: {} # Allow users to add any ingress annotations.
    hosts:
    - host: chart-example.local # Default host, users should override.
      paths:
      - / # Default path.
    tls:
    - hosts:
      - app.example.com
      secretName: app.example.com

queue:
  enabled: false

  image:
    repository: serversideup/php
    pullPolicy: Always
    tag: "8.5-cli"

  replicaCount: 1

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 50%
    type: RollingUpdate

  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 200M
  # requests:
  #   cpu: 50m
  #   memory: 100M

  nodeSelector: {}

  tolerations: []

  podAnnotations: {}

  podSecurityContext: {}

  # Extra volumes to mount on the container.
  extraVolumeMounts: []
  # - name: my-extra-volume
  #   mountPath: /path/in/container

  extraVolumes: []
  # - name: my-extra-volume
  #   emptyDir: {}

  affinity: {}
  #     podAntiAffinity:
  #       preferredDuringSchedulingIgnoredDuringExecution:
  #         - podAffinityTerm:
  #             labelSelector:
  #               matchExpressions:
  #                 - key: role
  #                   operator: In
  #                   values:
  #                     - backend
  #             topologyKey: kubernetes.io/hostname
  #           weight: 100

  # run caching commands that will cache things like views and config files into bootstrap/cache (thats the only folder that is shared between all pods)
  initCommands:
  - php artisan optimize
  - php artisan view:cache

  command: php artisan horizon

reverb:
  enabled: false

  image:
    repository: serversideup/php
    pullPolicy: Always
    tag: "8.5-cli"

  replicaCount: 1

  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate

  command: php artisan reverb:start --host=0.0.0.0 --port=8080

  podAnnotations: {}

  podSecurityContext: {}

  resources: {}

  extraVolumeMounts: []

  extraVolumes: []

  nodeSelector: {}

  affinity: {}

  tolerations: []

  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
    annotations: {}
    labels: {}

  livenessProbe:
    tcpSocket:
      port: http
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 5

  readinessProbe:
    tcpSocket:
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5

  ingress:
    enabled: false
    ingressClassName: ""
    annotations: {}
    hosts:
    - host: reverb.example.com
      paths:
      - /
    tls: []

