      maxUnavailable: 0
    type: RollingUpdate

  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 200M
  # requests:
  #   cpu: 50m
  #   memory: 100M

  nodeSelector: {}

  tolerations: []

  podAnnotations: {}

  podSecurityContext: {}

  # Extra volumes to mount on the container.
  extraVolumeMounts: []
  # - name: my-extra-volume
  #   mountPath: /path/in/container

  extraVolumes: []
  # - name: my-extra-volume
  #   emptyDir: {}

  affinity: {}
  #     podAntiAffinity:
  #       preferredDuringSchedulingIgnoredDuringExecution:
  #         - podAffinityTerm:
  #             labelSelector:
  #               matchExpressions:
  #                 - key: role
  #                   operator: In
  #                   values:
  #                     - backend
  #             topologyKey: kubernetes.io/hostname
  #           weight: 100

  # run caching commands that will cache things like views and config files into bootstrap/cache (thats the only folder that is shared between all pods)
  initCommands:
  - php artisan optimize
  - php artisan view:cache

  command: php artisan schedule:work

valkey:
  # https://artifacthub.io/packages/helm/bitnami/valkey
  enabled: false

  image:
    repository: bitnamilegacy/valkey

  fullnameOverride: laravel-valkey

  auth:
    enabled: false
    password: "yourpassword"

  ## @param architecture Valkey architecture. Allowed values: `standalone` or `replication`
  ##
  architecture: standalone

  primary:
    disableCommands:
    - FLUSHALL

    persistence:
      ## @param primary.persistence.enabled Enable persistence on Valkey primary nodes using Persistent Volume Claims
      ##
      enabled: true

      ## @param primary.persistence.storageClass Persistent Volume storage class
      ## If defined, storageClassName: <storageClass>
      ## If set to "-", storageClassName: "", which disables dynamic provisioning
      ## If undefined (the default) or set to null, no storageClassName spec is set, choosing the default provisioner
      ##
      storageClass: ""

      ## @param primary.persistence.accessModes Persistent Volume access modes
      ##
      accessModes:
      - ReadWriteOnce

      ## @param primary.persistence.size Persistent Volume size
      ##
      size: 8Gi

  # any other Valkey-specific overrides...


meilisearch:
  # https://artifacthub.io/packages/helm/meilisearch-kubernetes/meilisearch
  enabled: false

  fullnameOverride: laravel-meilisearch

  # Environment loaded into the configMap
  environment:
    # -- Deactivates analytics
    MEILI_NO_ANALYTICS: true
    # -- Sets the environment. Either **production** or **development**
    MEILI_ENV: production
    # For production deployment, the environment MEILI_MASTER_KEY is required.
    # If MEILI_ENV is set to "production" without setting MEILI_MASTER_KEY, this
    # chart will automatically create a secure MEILI_MASTER_KEY and push it as a
    # secret. Otherwise the below value of MEILI_MASTER_KEY will be used instead.
    # MEILI_MASTER_KEY: ""

  auth:
    # -- Use an existing Kubernetes secret for the MEILI_MASTER_KEY
    existingMasterKeySecret: "meilisearch-master-key"

  persistence:
    enabled: true

    accessMode: "ReadWriteOnce"

    size: "10Gi"

    storageClass: ""


  # any other MeiliSearch-specific overrides...
