global: {}

# Non-sensitive environment variables shared by all application workloads.
# Never put APP_KEY, database passwords, or other secrets here: this renders
# into a ConfigMap. Use existingEnvSecrets for sensitive values.
envs: {}

# Existing Secrets whose keys are exposed as environment variables to the app,
# queue, scheduler, reverb, and their init/migration containers.
existingEnvSecrets: []

imagePullSecrets: []

# Application workloads do not need Kubernetes API credentials by default.
automountServiceAccountToken: false

# Restricted Pod Security Standard-compatible defaults. Each component can
# override individual fields with its own podSecurityContext and
# containerSecurityContext.
podSecurityContext:
  runAsNonRoot: true
  # The default Debian-based serversideup/php image runs as www-data (33).
  # Override this for Alpine-based or custom images.
  fsGroup: 33
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false

serviceAccount:
  # Specifies whether a ServiceAccount should be created
  create: false
  # The name of the ServiceAccount to use. If not set and create is true, a name is generated using the fullname template
  name: ""
  # Additional annotations for the ServiceAccount
  annotations: {}
  # Override the global token-automount setting for the ServiceAccount.
  automountServiceAccountToken: false

webRoot: "/var/www/html"

statamic:
  enabled: false

  # this is the repo for the content for the app. as we only map the content folders, we can also use the same repo as the app repo itself.
  repo:
    sshUrl: "git@github.com:org/repository.git"
    # Existing Secret with `id_key` and `known_hosts` keys. When set, the chart
    # does not render SSH credentials from Helm values.
    existingSecret: ""
    sshPrivateKey: ""
    knownHosts: ""

  git:
    user: "statamic"
    email: "statamic@example.com"
    message: "Update from production [ci skip]"
    push: true
    image:
      repository: alpine/git
      tag: "2.49.1"
      pullPolicy: IfNotPresent
    resources: {}
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 33
      runAsGroup: 33
      fsGroup: 33
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: false
    nodeSelector: {}
    tolerations: []
    affinity: {}
    ttlSecondsAfterFinished: 300
    backoffLimit: 3

  schedule: "*/10 * * * *"

  persistence:
    accessMode: "ReadWriteOnce"
    size: "10Gi"
    storageClass: ""

networkPolicy:
  enabled: false
  ingress:
    # Select the ingress controller namespace/pods allowed to reach app and
    # Reverb. Empty selectors allow ingress from every namespace/pod.
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: ingress-nginx
    podSelector:
      matchLabels:
        app.kubernetes.io/name: ingress-nginx
  egress:
    # Additional egress rules appended after DNS and enabled in-chart services.
    additionalRules: []

app:
  enabled: true

  image:
    repository: serversideup/php
    pullPolicy: Always
    tag: "8.5-fpm-nginx"

  replicaCount: 1

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
    behavior: {}

  podDisruptionBudget:
    enabled: false
    minAvailable: 1
    maxUnavailable: null

  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate

  nodeSelector: {}

  tolerations: []

  podAnnotations: {}

  podSecurityContext: {}
  containerSecurityContext: {}

  terminationGracePeriodSeconds: 30
  revisionHistoryLimit: 10
  priorityClassName: ""
  topologySpreadConstraints: []

  runtimeCache:
    sizeLimit: 64Mi

  lifecycle: {}

  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 200M
  # requests:
  #   cpu: 50m
  #   memory: 100M

  # Extra volumes to mount on the container.
  extraVolumeMounts: []
  # - name: my-extra-volume
  #   mountPath: /path/in/container

  extraVolumes: []
  # - name: my-extra-volume
  #   emptyDir: {}

  affinity: {}
  #     podAntiAffinity:
  #       preferredDuringSchedulingIgnoredDuringExecution:
  #         - podAffinityTerm:
  #             labelSelector:
  #               matchExpressions:
  #                 - key: role
  #                   operator: In
  #                   values:
  #                     - backend
  #             topologyKey: kubernetes.io/hostname
  #           weight: 100

  # run caching commands that will cache things like views and config files into bootstrap/cache (thats the only folder that is shared between all pods)
  initCommands:
  - php artisan optimize
  - php artisan view:cache

  command:

  # Run the application with Laravel Octane. app.command takes precedence when set.
  octane:
    enabled: false
    server: frankenphp
    host: 0.0.0.0
    port: 8080
    maxRequests: 500
    # Leave empty to let Octane choose the worker count.
    workers: ""
    livenessProbe:
      httpGet:
        path: /up
        port: http
      initialDelaySeconds: 15
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 5
    readinessProbe:
      httpGet:
        path: /up
        port: http
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 5

  migrate:
    enabled: true
    # initContainer runs once per new pod. hook runs once per Helm
    # install/upgrade and is usually preferable for multiple replicas.
    mode: initContainer
    command: "php artisan migrate --isolated --force"
    ttlSecondsAfterFinished: 300
    backoffLimit: 3
    resources: {}

  service:
    type: ClusterIP  # Default service type.
    port: 80  # Default port the service listens on.
    targetPort: 8080  # serversideup/php v3 listens as a non-root user on 8080.
    nodePort: null  # Optional fixed port for service.type=NodePort.
    annotations: {}  # Annotations to add to the service.
    labels: {}  # Additional labels to add to the service.
    externalTrafficPolicy: Cluster  # Can be set to Local to preserve source IP, or Cluster for default behavior.
    loadBalancerIP: ""  # To set a specific IP for a LoadBalancer type service.
    loadBalancerSourceRanges: []  # IP whitelist for LoadBalancers.

  serviceMonitor:
    enabled: false

  livenessProbe:
    failureThreshold: 5
    initialDelaySeconds: 60
    periodSeconds: 15
    timeoutSeconds: 5
    httpGet:
      path: /up
      port: http

  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    httpGet:
      path: /up
      port: http

  startupProbe:
    failureThreshold: 30
    periodSeconds: 5
    timeoutSeconds: 5
    httpGet:
      path: /up
      port: http

  ingress:
    enabled: false  # By default, do not create an ingress.
    ingressClassName: ""  # Set to the name of the ingress class to use annotations.
    annotations: {}  # Allow users to add any ingress annotations.
    hosts:
    - host: chart-example.local  # Default host, users should override.
      paths:
      - /  # Default path.
    tls:
    - hosts:
      - app.example.com
      secretName: app.example.com

queue:
  enabled: false

  image:
    repository: serversideup/php
    pullPolicy: Always
    tag: "8.5-cli"

  replicaCount: 1

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
    behavior: {}

  podDisruptionBudget:
    enabled: false
    minAvailable: 1
    maxUnavailable: null

  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 50%
    type: RollingUpdate

  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 200M
  # requests:
  #   cpu: 50m
  #   memory: 100M

  nodeSelector: {}

  tolerations: []

  podAnnotations: {}

  podSecurityContext: {}
  containerSecurityContext: {}

  terminationGracePeriodSeconds: 300
  revisionHistoryLimit: 10
  priorityClassName: ""
  topologySpreadConstraints: []

  runtimeCache:
    sizeLimit: 64Mi

  # Horizon receives SIGTERM and drains active workers during this grace period.
  lifecycle: {}

  # Extra volumes to mount on the container.
  extraVolumeMounts: []
  # - name: my-extra-volume
  #   mountPath: /path/in/container

  extraVolumes: []
  # - name: my-extra-volume
  #   emptyDir: {}

  affinity: {}
  #     podAntiAffinity:
  #       preferredDuringSchedulingIgnoredDuringExecution:
  #         - podAffinityTerm:
  #             labelSelector:
  #               matchExpressions:
  #                 - key: role
  #                   operator: In
  #                   values:
  #                     - backend
  #             topologyKey: kubernetes.io/hostname
  #           weight: 100

  # run caching commands that will cache things like views and config files into bootstrap/cache (thats the only folder that is shared between all pods)
  initCommands:
  - php artisan optimize
  - php artisan view:cache

  command: php artisan horizon

reverb:
  enabled: false

  image:
    repository: serversideup/php
    pullPolicy: Always
    tag: "8.5-cli"

  replicaCount: 1

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 20
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
    behavior: {}

  podDisruptionBudget:
    enabled: false
    minAvailable: 1
    maxUnavailable: null

  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate

  command: php artisan reverb:start --host=0.0.0.0 --port=8080

  podAnnotations: {}

  podSecurityContext: {}
  containerSecurityContext: {}

  terminationGracePeriodSeconds: 30
  revisionHistoryLimit: 10
  priorityClassName: ""
  topologySpreadConstraints: []

  runtimeCache:
    sizeLimit: 64Mi

  lifecycle: {}

  resources: {}

  extraVolumeMounts: []

  extraVolumes: []

  nodeSelector: {}

  affinity: {}

  tolerations: []

  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
    nodePort: null
    annotations: {}
    labels: {}
    externalTrafficPolicy: Cluster
    loadBalancerIP: ""
    loadBalancerSourceRanges: []

  livenessProbe:
    tcpSocket:
      port: http
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 5

  readinessProbe:
    tcpSocket:
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5

  startupProbe:
    tcpSocket:
      port: http
    failureThreshold: 30
    periodSeconds: 2

  ingress:
    enabled: false
    ingressClassName: ""
    annotations: {}
    hosts:
    - host: reverb.example.com
      paths:
      - /
    tls: []

scheduler:
  enabled: false

  image:
    repository: serversideup/php
    pullPolicy: Always
    tag: "8.5-cli"

  # The scheduler always runs exactly one replica with a Recreate strategy to
  # prevent scheduled commands from running more than once.

  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 200M
  # requests:
  #   cpu: 50m
  #   memory: 100M

  nodeSelector: {}

  tolerations: []

  podAnnotations: {}

  podSecurityContext: {}
  containerSecurityContext: {}

  terminationGracePeriodSeconds: 30
  revisionHistoryLimit: 10
  priorityClassName: ""
  topologySpreadConstraints: []

  runtimeCache:
    sizeLimit: 64Mi

  lifecycle: {}

  # Extra volumes to mount on the container.
  extraVolumeMounts: []
  # - name: my-extra-volume
  #   mountPath: /path/in/container

  extraVolumes: []
  # - name: my-extra-volume
  #   emptyDir: {}

  affinity: {}
  #     podAntiAffinity:
  #       preferredDuringSchedulingIgnoredDuringExecution:
  #         - podAffinityTerm:
  #             labelSelector:
  #               matchExpressions:
  #                 - key: role
  #                   operator: In
  #                   values:
  #                     - backend
  #             topologyKey: kubernetes.io/hostname
  #           weight: 100

  # run caching commands that will cache things like views and config files into bootstrap/cache (thats the only folder that is shared between all pods)
  initCommands:
  - php artisan optimize
  - php artisan view:cache

  command: php artisan schedule:work

valkey:
  # https://artifacthub.io/packages/helm/bitnami/valkey
  enabled: false

  auth:
    enabled: true
    # Empty lets the dependency generate a random password. Prefer
    # auth.existingSecret so the application can consume the same credential.
    password: ""

  ## @param architecture Valkey architecture. Allowed values: `standalone` or `replication`
  ##
  architecture: standalone

  primary:
    disableCommands:
    - FLUSHALL

    persistence:
      ## @param primary.persistence.enabled Enable persistence on Valkey primary nodes using Persistent Volume Claims
      ##
      enabled: true

      ## @param primary.persistence.storageClass Persistent Volume storage class
      ## If defined, storageClassName: <storageClass>
      ## If set to "-", storageClassName: "", which disables dynamic provisioning
      ## If undefined (the default) or set to null, no storageClassName spec is set, choosing the default provisioner
      ##
      storageClass: ""

      ## @param primary.persistence.accessModes Persistent Volume access modes
      ##
      accessModes:
      - ReadWriteOnce

      ## @param primary.persistence.size Persistent Volume size
      ##
      size: 8Gi

  # any other Valkey-specific overrides...
