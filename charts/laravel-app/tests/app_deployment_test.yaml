suite: app deployment
templates:
- templates/app/deployment.yaml
- templates/configmap-envs.yaml
tests:
- it: renders restricted security defaults
  template: templates/app/deployment.yaml
  asserts:
  - isKind:
      of: Deployment
  - equal:
      path: spec.template.spec.automountServiceAccountToken
      value: false
  - equal:
      path: spec.template.spec.securityContext.runAsNonRoot
      value: true
  - equal:
      path: spec.template.spec.securityContext.runAsUser
      value: 33
  - equal:
      path: spec.template.spec.securityContext.runAsGroup
      value: 33
  - equal:
      path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
      value: false
  - contains:
      path: spec.template.spec.containers[0].securityContext.capabilities.drop
      content: ALL
- it: safely renders shell metacharacters in a custom command
  template: templates/app/deployment.yaml
  set:
    app.command: "php artisan test --filter='value: #1'"
  asserts:
  - equal:
      path: spec.template.spec.containers[0].args[0]
      value: "php artisan test --filter='value: #1'"
- it: starts octane with --log-level so FrankenPHP keeps the real log message
  template: templates/app/deployment.yaml
  set:
    app.octane.enabled: true
  asserts:
  - equal:
      path: spec.template.spec.containers[0].args[0]
      value: "php artisan octane:start --server=frankenphp --host=0.0.0.0 --port=8080 --max-requests=500 --log-level=info"
- it: honors a custom octane log level
  template: templates/app/deployment.yaml
  set:
    app.octane.enabled: true
    app.octane.logLevel: debug
  asserts:
  - equal:
      path: spec.template.spec.containers[0].args[0]
      value: "php artisan octane:start --server=frankenphp --host=0.0.0.0 --port=8080 --max-requests=500 --log-level=debug"
- it: renders zero replicas when scaled down
  template: templates/app/deployment.yaml
  set:
    app.replicaCount: 0
  asserts:
  - equal:
      path: spec.replicas
      value: 0
- it: omits replicas when autoscaling is enabled
  template: templates/app/deployment.yaml
  set:
    app.autoscaling.enabled: true
  asserts:
  - notExists:
      path: spec.replicas
- it: gives the init containers the app's resources
  template: templates/app/deployment.yaml
  set:
    app.resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 1Gi}
  asserts:
  - equal:
      path: spec.template.spec.initContainers[0].name
      value: init
  - equal:
      path: spec.template.spec.initContainers[0].resources.limits.memory
      value: 1Gi
  - equal:
      path: spec.template.spec.initContainers[1].name
      value: migrate
  - equal:
      path: spec.template.spec.initContainers[1].resources.limits.memory
      value: 1Gi
- it: lets migrate.resources override the migrate init container
  template: templates/app/deployment.yaml
  set:
    app.resources:
      limits: {memory: 1Gi}
    app.migrate.resources:
      limits: {memory: 512Mi}
  asserts:
  - equal:
      path: spec.template.spec.initContainers[1].resources.limits.memory
      value: 512Mi
  - equal:
      path: spec.template.spec.initContainers[0].resources.limits.memory
      value: 1Gi
- it: leaves init containers without resources when the app has none
  template: templates/app/deployment.yaml
  asserts:
  - notExists:
      path: spec.template.spec.initContainers[0].resources
