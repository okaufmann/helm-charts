suite: app deployment
templates:
- templates/app/deployment.yaml
- templates/configmap-envs.yaml
tests:
- it: renders restricted security defaults
  template: templates/app/deployment.yaml
  asserts:
  - isKind:
      of: Deployment
  - equal:
      path: spec.template.spec.automountServiceAccountToken
      value: false
  - equal:
      path: spec.template.spec.securityContext.runAsNonRoot
      value: true
  - equal:
      path: spec.template.spec.securityContext.runAsUser
      value: 33
  - equal:
      path: spec.template.spec.securityContext.runAsGroup
      value: 33
  - equal:
      path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
      value: false
  - contains:
      path: spec.template.spec.containers[0].securityContext.capabilities.drop
      content: ALL
- it: safely renders shell metacharacters in a custom command
  template: templates/app/deployment.yaml
  set:
    app.command: "php artisan test --filter='value: #1'"
  asserts:
  - equal:
      path: spec.template.spec.containers[0].args[0]
      value: "php artisan test --filter='value: #1'"
- it: starts octane with --log-level so FrankenPHP keeps the real log message
  template: templates/app/deployment.yaml
  set:
    app.octane.enabled: true
  asserts:
  - equal:
      path: spec.template.spec.containers[0].args[0]
      value: "php artisan octane:start --server=frankenphp --host=0.0.0.0 --port=8080 --max-requests=500 --log-level=info"
- it: honors a custom octane log level
  template: templates/app/deployment.yaml
  set:
    app.octane.enabled: true
    app.octane.logLevel: debug
  asserts:
  - equal:
      path: spec.template.spec.containers[0].args[0]
      value: "php artisan octane:start --server=frankenphp --host=0.0.0.0 --port=8080 --max-requests=500 --log-level=debug"
- it: omits replicas when autoscaling is enabled
  template: templates/app/deployment.yaml
  set:
    app.autoscaling.enabled: true
  asserts:
  - notExists:
      path: spec.replicas
