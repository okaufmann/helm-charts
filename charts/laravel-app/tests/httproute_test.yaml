suite: httproute
templates:
- templates/httproute.yaml
tests:
- it: renders nothing unless enabled
  asserts:
  - hasDocuments:
      count: 0
- it: renders an HTTPRoute and an uptime bridge
  set:
    fullnameOverride: solid3d-relay
    httpRoute.enabled: true
    httpRoute.annotations:
      uptime-kuma.io/monitor: "true"
    httpRoute.parentRefs:
    - name: public
      namespace: kube-system
      sectionName: https
    httpRoute.hostnames:
    - relay.solid3d.ch
    httpRoute.rules:
    - path: /ws
      timeouts:
        request: 3600s
        backendRequest: 3600s
      backend:
        name: solid3d-relay-reverb
        port: 8081
    - path: /
      backend:
        name: solid3d-relay-app-service
        port: 80
    httpRoute.uptimeBridge.enabled: true
    httpRoute.uptimeBridge.service.name: solid3d-relay-app-service
    httpRoute.uptimeBridge.service.port: 80
  asserts:
  - hasDocuments:
      count: 2
  - documentSelector:
      path: kind
      value: HTTPRoute
    isKind:
      of: HTTPRoute
  - documentSelector:
      path: kind
      value: HTTPRoute
    equal:
      path: spec.hostnames[0]
      value: relay.solid3d.ch
  - documentSelector:
      path: kind
      value: HTTPRoute
    equal:
      path: spec.rules[0].backendRefs[0].name
      value: solid3d-relay-reverb
  - documentSelector:
      path: kind
      value: HTTPRoute
    equal:
      path: spec.rules[1].backendRefs[0].port
      value: 80
  - documentSelector:
      path: kind
      value: Ingress
    equal:
      path: spec.ingressClassName
      value: uptime-only
  - documentSelector:
      path: kind
      value: Ingress
    equal:
      path: spec.tls[0].hosts[0]
      value: relay.solid3d.ch
  - documentSelector:
      path: kind
      value: Ingress
    notExists:
      path: spec.tls[0].secretName
- it: renders a ListenerSet and attaches the route to it
  set:
    fullnameOverride: app
    httpRoute.enabled: true
    httpRoute.hostnames:
    - www.example.com
    - example.com
    httpRoute.rules:
    - backend:
        name: app
        port: 80
    httpRoute.listenerSet.enabled: true
    httpRoute.listenerSet.gateway.name: public
    httpRoute.listenerSet.gateway.namespace: kube-system
    httpRoute.listenerSet.port: 30443
    httpRoute.listenerSet.clusterIssuer: letsencrypt
  asserts:
  - hasDocuments:
      count: 2
  - documentSelector:
      path: kind
      value: ListenerSet
    equal:
      path: metadata.annotations["cert-manager.io/cluster-issuer"]
      value: letsencrypt
  - documentSelector:
      path: kind
      value: ListenerSet
    equal:
      path: spec.listeners[1]
      value:
        name: example-com
        hostname: example.com
        protocol: HTTPS
        port: 30443
        tls:
          mode: Terminate
          certificateRefs:
          - name: app-tls
  - documentSelector:
      path: kind
      value: HTTPRoute
    equal:
      path: spec.parentRefs
      value:
      - group: gateway.networking.k8s.io
        kind: ListenerSet
        name: app
- it: fails without parentRefs or a ListenerSet
  set:
    httpRoute.enabled: true
    httpRoute.hostnames: [app.example.com]
    httpRoute.rules:
    - backend:
        name: app
        port: 80
  asserts:
  - failedTemplate:
      errorMessage: httpRoute needs parentRefs or listenerSet.enabled
