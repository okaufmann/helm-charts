suite: statamic git workloads
templates:
- templates/statamic/git-scripts-configmap.yaml
- templates/statamic/git-pull-job.yaml
- templates/statamic/git-commit-cronjob.yaml
- templates/statamic/ssh-secret.yaml
- templates/init-script.yaml
- templates/queue/deployment.yaml
- templates/app/deployment.yaml
- templates/configmap-envs.yaml
set:
  statamic.enabled: true
  statamic.repo.existingSecret: statamic-ssh
tests:
- it: keeps user-controlled Git values out of the shell script
  template: templates/statamic/git-scripts-configmap.yaml
  set:
    statamic.git.message: "content: \"quoted\"; echo unsafe"
  asserts:
  - notMatchRegex:
      path: data["commit.sh"]
      pattern: "echo unsafe"
  - notMatchRegex:
      path: data["clone.sh"]
      pattern: "echo unsafe"
  - matchRegex:
      path: data["commit.sh"]
      pattern: "\\$GIT_MESSAGE"
  - matchRegex:
      path: data["clone.sh"]
      pattern: "\\$GIT_MESSAGE"
- it: runs the clone job as the shared non-root user
  template: templates/statamic/git-pull-job.yaml
  set:
    statamic.git.image.repository: example/git
    statamic.git.image.tag: "1.2.3"
    statamic.repo.branch: develop
  asserts:
  - equal:
      path: spec.template.spec.securityContext.runAsUser
      value: 33
  - equal:
      path: spec.template.spec.containers[0].image
      value: example/git:1.2.3
  - equal:
      path: spec.template.spec.automountServiceAccountToken
      value: false
  - equal:
      path: spec.template.spec.containers[0].env[1].name
      value: REPO_BRANCH
  - equal:
      path: spec.template.spec.containers[0].env[1].value
      value: develop
  - equal:
      path: spec.template.spec.containers[0].env[2].name
      value: GIT_SYNC
  - equal:
      path: spec.template.spec.containers[0].env[2].value
      value: commit
  - equal:
      path: spec.template.spec.containers[0].env[3].name
      value: GIT_USER
  - equal:
      path: spec.template.spec.containers[0].env[5].name
      value: GIT_MESSAGE
  - equal:
      path: spec.template.spec.containers[0].env[7].name
      value: HOME
  - equal:
      path: spec.template.spec.containers[0].env[7].value
      value: /tmp
  - contains:
      path: spec.template.spec.containers[0].volumeMounts
      content:
        name: scripts
        mountPath: /etc/passwd
        subPath: passwd
  - contains:
      path: spec.template.spec.containers[0].volumeMounts
      content:
        name: scratch
        mountPath: /scratch
- it: mounts a passwd row for the git uid so alpine/git can SSH
  template: templates/statamic/git-scripts-configmap.yaml
  asserts:
  - matchRegex:
      path: data["passwd"]
      pattern: "git:x:33:33:git:/tmp:"
  - matchRegex:
      path: data["clone.sh"]
      pattern: "\\. /scripts/ssh-env\\.sh"
  - matchRegex:
      path: data["ssh-env.sh"]
      pattern: "chmod 0400"
- it: keeps the clone Job in the release manifest so it sees current scripts
  template: templates/statamic/git-pull-job.yaml
  asserts:
  - isNull:
      path: metadata.annotations["helm.sh/hook"]
  - matchRegex:
      path: metadata.name
      pattern: "-git-clone-[0-9]+$"
- it: keeps incremental fetches off the index-pack path
  template: templates/statamic/git-scripts-configmap.yaml
  set:
    statamic.git.unpackLimit: 4242
  asserts:
  - matchRegex:
      path: data["clone.sh"]
      pattern: "fetch.unpackLimit=4242"
  - matchRegex:
      path: data["commit.sh"]
      pattern: "fetch.unpackLimit=4242"
  # The initial clone stays on the pack path (local scratch, then copy) so it
  # does not explode into loose objects on the PVC.
  - matchRegex:
      path: data["clone.sh"]
      pattern: "git clone \"\\$REPO_URL\" /scratch/repo"
  - matchRegex:
      path: data["clone.sh"]
      pattern: "tar -C /scratch/repo -cf -"
- it: waits for the checkout instead of linking image content
  template: templates/init-script.yaml
  set:
    statamic.contentWaitSeconds: 42
  asserts:
  - matchRegex:
      path: data["init.sh"]
      pattern: "-lt 42"
  - matchRegex:
      path: data["init.sh"]
      pattern: "refusing to start with image content"
- it: runs the linker as the entrypoint when a command is set
  template: templates/queue/deployment.yaml
  set:
    queue.enabled: true
    queue.command: php artisan horizon
  asserts:
  - equal:
      path: spec.template.spec.containers[0].command
      value: ["/app/init.sh"]
  - equal:
      path: spec.template.spec.containers[0].args
      value: ["/bin/sh", "-c", "php artisan horizon"]
- it: starts FrankenPHP through the linker when no app.command is set
  template: templates/app/deployment.yaml
  asserts:
  - equal:
      path: spec.template.spec.containers[0].command
      value: ["/app/init.sh"]
  - equal:
      path: spec.template.spec.containers[0].args
      value:
        - /bin/sh
        - -c
        - exec frankenphp run --config /etc/frankenphp/Caddyfile --adapter caddyfile
- it: honors statamic.webCommand
  template: templates/app/deployment.yaml
  set:
    statamic.webCommand: exec custom-web-server
  asserts:
  - equal:
      path: spec.template.spec.containers[0].args[2]
      value: exec custom-web-server
- it: wraps Octane through the linker instead of STARTUP_SCRIPT_PATH
  template: templates/app/deployment.yaml
  set:
    app.octane.enabled: true
  asserts:
  - equal:
      path: spec.template.spec.containers[0].command
      value: ["/app/init.sh"]
  - equal:
      path: spec.template.spec.containers[0].args
      value:
        - /bin/sh
        - -c
        - php artisan octane:start --server=frankenphp --host=0.0.0.0 --port=8080 --max-requests=500 --log-level=info
- it: execs the real process after linking
  template: templates/init-script.yaml
  asserts:
  - matchRegex:
      path: data["init.sh"]
      pattern: 'exec "\$@"'
- it: clones a configured branch and skips pull on a dirty tree
  template: templates/statamic/git-scripts-configmap.yaml
  asserts:
  - matchRegex:
      path: data["clone.sh"]
      pattern: "git clone --branch \"\\$REPO_BRANCH\" --single-branch"
  - matchRegex:
      path: data["clone.sh"]
      pattern: "skipping pull to preserve local Statamic changes"
- it: commits dirty content before pull --rebase
  template: templates/statamic/git-scripts-configmap.yaml
  asserts:
  - matchRegex:
      path: data["clone.sh"]
      pattern: "Committing local Statamic changes before pull"
  - matchRegex:
      path: data["clone.sh"]
      pattern: "pull --rebase origin"
  - matchRegex:
      path: data["clone.sh"]
      pattern: "\\$GIT_MESSAGE"
- it: resets a dirty tree to origin when git sync is reset
  template: templates/statamic/git-scripts-configmap.yaml
  asserts:
  - matchRegex:
      path: data["clone.sh"]
      pattern: "checkout -f -B"
  - matchRegex:
      path: data["clone.sh"]
      pattern: "git_safe clean -fd"
- it: passes reset sync to the clone job
  template: templates/statamic/git-pull-job.yaml
  set:
    statamic.git.sync: reset
  asserts:
  - equal:
      path: spec.template.spec.containers[0].env[2].name
      value: GIT_SYNC
  - equal:
      path: spec.template.spec.containers[0].env[2].value
      value: reset
- it: passes preserve sync to the clone job
  template: templates/statamic/git-pull-job.yaml
  set:
    statamic.git.sync: preserve
  asserts:
  - equal:
      path: spec.template.spec.containers[0].env[2].name
      value: GIT_SYNC
  - equal:
      path: spec.template.spec.containers[0].env[2].value
      value: preserve
- it: passes the commit message as an environment value
  template: templates/statamic/git-commit-cronjob.yaml
  set:
    statamic.git.message: "content: \"quoted\"; echo safe"
  asserts:
  - equal:
      path: spec.jobTemplate.spec.template.spec.containers[0].env[2].value
      value: "content: \"quoted\"; echo safe"
- it: omits the commit CronJob when git push is disabled
  template: templates/statamic/git-commit-cronjob.yaml
  set:
    statamic.git.push: false
  asserts:
  - hasDocuments:
      count: 0
- it: still renders the commit CronJob when git push is left at the default
  template: templates/statamic/git-commit-cronjob.yaml
  asserts:
  - hasDocuments:
      count: 1
  - isKind:
      of: CronJob
