suite: statamic git workloads
templates:
- templates/statamic/git-scripts-configmap.yaml
- templates/statamic/git-pull-job.yaml
- templates/statamic/git-commit-cronjob.yaml
set:
  statamic.enabled: true
  statamic.repo.existingSecret: statamic-ssh
tests:
- it: keeps user-controlled Git values out of the shell script
  template: templates/statamic/git-scripts-configmap.yaml
  set:
    statamic.git.message: "content: \"quoted\"; echo unsafe"
  asserts:
  - notMatchRegex:
      path: data["commit.sh"]
      pattern: "echo unsafe"
  - matchRegex:
      path: data["commit.sh"]
      pattern: "\\$GIT_MESSAGE"
- it: runs the clone job as the shared non-root user
  template: templates/statamic/git-pull-job.yaml
  set:
    statamic.git.image.repository: example/git
    statamic.git.image.tag: "1.2.3"
    statamic.repo.branch: develop
  asserts:
  - equal:
      path: spec.template.spec.securityContext.runAsUser
      value: 33
  - equal:
      path: spec.template.spec.containers[0].image
      value: example/git:1.2.3
  - equal:
      path: spec.template.spec.automountServiceAccountToken
      value: false
  - equal:
      path: spec.template.spec.containers[0].env[1].name
      value: REPO_BRANCH
  - equal:
      path: spec.template.spec.containers[0].env[1].value
      value: develop
- it: clones a configured branch and skips pull on a dirty tree
  template: templates/statamic/git-scripts-configmap.yaml
  asserts:
  - matchRegex:
      path: data["clone.sh"]
      pattern: "git clone --branch \"\\$REPO_BRANCH\" --single-branch"
  - matchRegex:
      path: data["clone.sh"]
      pattern: "skipping pull to preserve local Statamic changes"
- it: passes the commit message as an environment value
  template: templates/statamic/git-commit-cronjob.yaml
  set:
    statamic.git.message: "content: \"quoted\"; echo safe"
  asserts:
  - equal:
      path: spec.jobTemplate.spec.template.spec.containers[0].env[2].value
      value: "content: \"quoted\"; echo safe"
