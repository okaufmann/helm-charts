suite: statamic git workloads
templates:
- templates/statamic/git-scripts-configmap.yaml
- templates/statamic/git-pull-job.yaml
- templates/statamic/git-commit-cronjob.yaml
- templates/statamic/ssh-secret.yaml
set:
  statamic.enabled: true
  statamic.repo.existingSecret: statamic-ssh
tests:
- it: keeps user-controlled Git values out of the shell script
  template: templates/statamic/git-scripts-configmap.yaml
  set:
    statamic.git.message: "content: \"quoted\"; echo unsafe"
  asserts:
  - notMatchRegex:
      path: data["commit.sh"]
      pattern: "echo unsafe"
  - matchRegex:
      path: data["commit.sh"]
      pattern: "\\$GIT_MESSAGE"
- it: runs the clone job as the shared non-root user
  template: templates/statamic/git-pull-job.yaml
  set:
    statamic.git.image.repository: example/git
    statamic.git.image.tag: "1.2.3"
    statamic.repo.branch: develop
  asserts:
  - equal:
      path: spec.template.spec.securityContext.runAsUser
      value: 33
  - equal:
      path: spec.template.spec.containers[0].image
      value: example/git:1.2.3
  - equal:
      path: spec.template.spec.automountServiceAccountToken
      value: false
  - equal:
      path: spec.template.spec.containers[0].env[1].name
      value: REPO_BRANCH
  - equal:
      path: spec.template.spec.containers[0].env[1].value
      value: develop
  - equal:
      path: spec.template.spec.containers[0].env[3].name
      value: HOME
  - equal:
      path: spec.template.spec.containers[0].env[3].value
      value: /tmp
  - contains:
      path: spec.template.spec.containers[0].volumeMounts
      content:
        name: scripts
        mountPath: /etc/passwd
        subPath: passwd
- it: mounts a passwd row for the git uid so alpine/git can SSH
  template: templates/statamic/git-scripts-configmap.yaml
  asserts:
  - matchRegex:
      path: data["passwd"]
      pattern: "git:x:33:33:git:/tmp:"
  - matchRegex:
      path: data["clone.sh"]
      pattern: "\\. /scripts/ssh-env\\.sh"
  - matchRegex:
      path: data["ssh-env.sh"]
      pattern: "chmod 0400"
- it: keeps the clone Job in the release manifest so it sees current scripts
  template: templates/statamic/git-pull-job.yaml
  asserts:
  - isNull:
      path: metadata.annotations["helm.sh/hook"]
  - matchRegex:
      path: metadata.name
      pattern: "-git-clone-[0-9]+$"
- it: clones a configured branch and skips pull on a dirty tree
  template: templates/statamic/git-scripts-configmap.yaml
  asserts:
  - matchRegex:
      path: data["clone.sh"]
      pattern: "git clone --branch \"\\$REPO_BRANCH\" --single-branch"
  - matchRegex:
      path: data["clone.sh"]
      pattern: "skipping pull to preserve local Statamic changes"
- it: passes the commit message as an environment value
  template: templates/statamic/git-commit-cronjob.yaml
  set:
    statamic.git.message: "content: \"quoted\"; echo safe"
  asserts:
  - equal:
      path: spec.jobTemplate.spec.template.spec.containers[0].env[2].value
      value: "content: \"quoted\"; echo safe"
- it: omits the commit CronJob when git push is disabled
  template: templates/statamic/git-commit-cronjob.yaml
  set:
    statamic.git.push: false
  asserts:
  - hasDocuments:
      count: 0
- it: still renders the commit CronJob when git push is left at the default
  template: templates/statamic/git-commit-cronjob.yaml
  asserts:
  - hasDocuments:
      count: 1
  - isKind:
      of: CronJob
