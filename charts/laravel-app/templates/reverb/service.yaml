{{- if .Values.reverb.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "laravel-app.fullname" . }}-reverb
  labels:
    {{- include "laravel-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: reverb
    {{- with .Values.reverb.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.reverb.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.reverb.service.type }}
  ports:
    - name: http
      port: {{ .Values.reverb.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "laravel-app.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: reverb
{{- end }}
