{{- if default true .Values.app.enabled }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "laravel-app.fullname" . }}-webapp
  labels:
    {{- include "laravel-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: webapp
spec:
  {{- if not .Values.app.autoscaling.enabled }}
  replicas: {{ .Values.app.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "laravel-app.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: webapp
  strategy:
    {{- toYaml .Values.app.strategy | nindent 4 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-envs.yaml") . | sha256sum }}
        checksum/meilisearch-key: {{ include (print $.Template.BasePath "/meilisearch-masterkey-secret.yaml") . | sha256sum }}
      {{- with .Values.app.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "laravel-app.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: webapp
        app.kubernetes.io/part-of: laravel-app
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "laravel-app.serviceAccountName" . }}
      {{- end }}

      volumes:
      - name: runtime-cache
        emptyDir:
          sizeLimit: 1Mi
      {{- if .Values.statamic.enabled }}
      - name: data
        emptyDir: {}
      - name: statamic
        persistentVolumeClaim:
          claimName: {{ include "laravel-app.fullname" . }}-statamic-pvc
      - name: init-script
        configMap:
          defaultMode: 448
          name: {{ include "laravel-app.fullname" . }}-init-script
      {{- end }}
      {{- with .Values.app.extraVolumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}

      initContainers:
        - name: init
          command:
            - /bin/bash
            - -c
            - |
              {{- range .Values.app.initCommands }}
              {{ . }} &&
              {{- end }}
              true
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          volumeMounts:
          - name: runtime-cache
            mountPath: {{ .Values.webRoot }}/bootstrap/cache
          {{- if .Values.statamic.enabled }}
          - name: statamic
            mountPath: /data/git
          - name: data
            mountPath: /data
          {{- end }}
          envFrom:
            {{- include "laravel-app.envFrom" . | nindent 12 }}
          {{- if and .Values.meilisearch.enabled .Values.meiliMasterKey }}
          env:
          - name: MEILISEARCH_KEY
            valueFrom:
              secretKeyRef:
                name: {{ .Values.meiliMasterKeySecretName }}
                key: MEILI_MASTER_KEY
          {{- end }}
        {{- if default true .Values.app.migrate.enabled }}
        - name: migrate
          command:
            - /bin/bash
            - -c
            - {{ .Values.app.migrate.command }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy | default "Always" }}
          volumeMounts:
          - name: runtime-cache
            mountPath: {{ .Values.webRoot }}/bootstrap/cache
          {{- if .Values.statamic.enabled }}
          - name: statamic
            mountPath: /data/git
          - name: data
            mountPath: /data
          {{- end }}
          envFrom:
            {{- include "laravel-app.envFrom" . | nindent 12 }}
        {{- end }}
      containers:
        - name: app
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          {{- if .Values.app.command }}
          command:
            - /bin/bash
            - -c
            - {{ .Values.app.command }}
          {{- else if .Values.app.octane.enabled }}
          command:
            - /bin/bash
            - -c
            - php artisan octane:start --server={{ .Values.app.octane.server }} --host={{ .Values.app.octane.host }} --port={{ .Values.app.octane.port }} --max-requests={{ .Values.app.octane.maxRequests }}{{ with .Values.app.octane.workers }} --workers={{ . }}{{ end }}
          {{- end }}
          volumeMounts:
          - name: runtime-cache
            mountPath: {{ .Values.webRoot }}/bootstrap/cache
          {{- if .Values.statamic.enabled }}
          - name: statamic
            mountPath: /data/git
          - name: data
            mountPath: /data
          - name: init-script
            mountPath: /app/init.sh
            subPath: init.sh
            readOnly: true
          {{- end }}
          {{- with .Values.app.extraVolumeMounts }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
          envFrom:
            {{- include "laravel-app.envFrom" . | nindent 12 }}
          {{- if .Values.statamic.enabled }}
          env:
          - name: STARTUP_SCRIPT_PATH
            value: /app/init.sh
          {{- end }}
          ports:
            - name: http
              {{- if .Values.app.octane.enabled }}
              containerPort: {{ .Values.app.octane.port }}
              {{- else }}
              containerPort: {{ .Values.app.service.targetPort }}
              {{- end }}
              protocol: TCP
          livenessProbe:
            {{- if .Values.app.octane.enabled }}
            {{- toYaml .Values.app.octane.livenessProbe | nindent 12 }}
            {{- else }}
            {{- toYaml .Values.app.livenessProbe | nindent 12 }}
            {{- end }}
          readinessProbe:
            {{- if .Values.app.octane.enabled }}
            {{- toYaml .Values.app.octane.readinessProbe | nindent 12 }}
            {{- else }}
            {{- toYaml .Values.app.readinessProbe | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
      {{- with .Values.app.nodeSelector }}
      nodeSelector:
          {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.affinity }}
      affinity:
          {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.tolerations }}
      tolerations:
          {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
