{{- if .Values.statamic.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  # Revision-suffixed because Job specs are immutable. This is deliberately
  # not a Helm hook: hooks run before the release manifest is applied, so the
  # Job would mount the previous revision's scripts ConfigMap and SSH Secret.
  name: {{ include "laravel-app.fullname" . }}-git-clone-{{ .Release.Revision }}
  labels:
    {{- include "laravel-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: statamic
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: {{ .Values.statamic.git.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.statamic.git.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "laravel-app.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: statamic-git-clone
        app.kubernetes.io/part-of: laravel-app
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        {{- toYaml .Values.statamic.git.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
      - name: ssh
        secret:
          secretName: {{ include "laravel-app.statamicSshSecretName" . }}
          defaultMode: 0440
          items:
          - key: id_key
            path: id_key
          - key: known_hosts
            path: known_hosts
      - name: data
        persistentVolumeClaim:
          claimName: {{ include "laravel-app.fullname" . }}-statamic-pvc
      - name: scripts
        configMap:
          name: {{ include "laravel-app.fullname" . }}-statamic-git-scripts
          defaultMode: 0550
      - name: scratch
        emptyDir: {}
      containers:
      - name: git-clone
        image: "{{ .Values.statamic.git.image.repository }}:{{ .Values.statamic.git.image.tag }}"
        imagePullPolicy: {{ .Values.statamic.git.image.pullPolicy }}
        securityContext:
          {{- toYaml .Values.statamic.git.containerSecurityContext | nindent 10 }}
        command: [/scripts/clone.sh]
        env:
        - name: REPO_URL
          value: {{ .Values.statamic.repo.sshUrl | quote }}
        - name: REPO_BRANCH
          value: {{ .Values.statamic.repo.branch | default "" | quote }}
        - name: GIT_SYNC
          value: {{ .Values.statamic.git.sync | default "commit" | quote }}
        - name: GIT_USER
          value: {{ .Values.statamic.git.user | quote }}
        - name: GIT_EMAIL
          value: {{ .Values.statamic.git.email | quote }}
        - name: GIT_MESSAGE
          value: {{ .Values.statamic.git.message | quote }}
        - name: GIT_SSH_COMMAND
          value: ssh -i /git/.ssh/id_key -o IdentitiesOnly=yes -o UserKnownHostsFile=/git/.ssh/known_hosts
        - name: HOME
          value: /tmp
        - name: RELEASE_REVISION
          value: {{ .Release.Revision | quote }}
        - name: GIT_PUSH
          value: {{ .Values.statamic.git.push | quote }}
        volumeMounts:
        - name: data
          mountPath: /data
        - name: scratch
          mountPath: /scratch
        - name: ssh
          mountPath: /git/.ssh
          readOnly: true
        - name: scripts
          mountPath: /scripts
          readOnly: true
        {{- include "laravel-app.statamicGitNssMounts" . | nindent 8 }}
        resources:
          {{- toYaml .Values.statamic.git.resources | nindent 10 }}
      {{- with .Values.statamic.git.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.statamic.git.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.statamic.git.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
