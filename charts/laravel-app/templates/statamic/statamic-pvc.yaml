{{- if .Values.statamic.enabled  -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "laravel-app.fullname" . }}-statamic-pvc
  labels:
    {{- include "laravel-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: statamic
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  {{- if eq .Values.statamic.persistence.storageClass "-" }}
  storageClassName: ""
  {{- else if .Values.statamic.persistence.storageClass }}
  storageClassName: {{ .Values.statamic.persistence.storageClass | quote }}
  {{- end }}
  accessModes:
    - {{ .Values.statamic.persistence.accessMode | quote }}
  resources:
    requests:
      storage: {{ .Values.statamic.persistence.size | quote }}
{{- end -}}
