{{- if .Values.statamic.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "laravel-app.fullname" . }}-statamic-git-scripts
  labels:
    {{- include "laravel-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: statamic
data:
  clone.sh: |-
    #!/bin/sh
    set -eu

    git_safe() {
      git -C /data -c safe.directory=/data "$@"
    }

    if [ ! -d /data/.git ]; then
      if [ -n "${REPO_BRANCH:-}" ]; then
        git clone --branch "$REPO_BRANCH" --single-branch "$REPO_URL" /data
      else
        git clone "$REPO_URL" /data
      fi
      exit 0
    fi

    git_safe fetch origin

    if [ -n "${REPO_BRANCH:-}" ]; then
      current="$(git_safe rev-parse --abbrev-ref HEAD)"
      if [ "$current" != "$REPO_BRANCH" ]; then
        if [ -z "$(git_safe status --porcelain)" ]; then
          git_safe checkout -B "$REPO_BRANCH" "origin/$REPO_BRANCH"
        else
          echo "Working tree is dirty on ${current}; not switching to ${REPO_BRANCH}."
          exit 0
        fi
      fi
    fi

    if [ -z "$(git_safe status --porcelain)" ]; then
      git_safe pull --rebase
    else
      echo "Working tree is dirty; skipping pull to preserve local Statamic changes."
    fi
  commit.sh: |-
    #!/bin/sh
    set -eu

    if [ -z "$(git -C /data -c safe.directory=/data status --porcelain)" ]; then
      echo "No Statamic content changes to commit."
      exit 0
    fi

    git -C /data -c safe.directory=/data add .
    git -C /data -c safe.directory=/data \
      -c user.name="$GIT_USER" \
      -c user.email="$GIT_EMAIL" \
      commit -m "$GIT_MESSAGE"
    git -C /data -c safe.directory=/data pull --rebase
    git -C /data -c safe.directory=/data push
{{- end }}
