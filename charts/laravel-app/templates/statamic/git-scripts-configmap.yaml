{{- if .Values.statamic.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "laravel-app.fullname" . }}-statamic-git-scripts
  labels:
    {{- include "laravel-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: statamic
data:
  passwd: |-
    root:x:0:0:root:/root:/sbin/nologin
    git:x:{{ include "laravel-app.statamicGitUid" . }}:{{ include "laravel-app.statamicGitGid" . }}:git:/tmp:/sbin/nologin
  group: |-
    root:x:0:
    git:x:{{ include "laravel-app.statamicGitGid" . }}:
  ssh-env.sh: |-
    #!/bin/sh
    # alpine/git has no passwd entry for uid 33; the job mounts one over
    # /etc/passwd. Copy the deploy key to $HOME so OpenSSH accepts 0400
    # perms (the Secret is 0440 + fsGroup and would otherwise be ignored).
    HOME=/tmp
    export HOME
    mkdir -p "$HOME/.ssh"
    cp /git/.ssh/id_key "$HOME/.ssh/id_key"
    cp /git/.ssh/known_hosts "$HOME/.ssh/known_hosts"
    chmod 0400 "$HOME/.ssh/id_key"
    chmod 0444 "$HOME/.ssh/known_hosts"
    GIT_SSH_COMMAND="ssh -i $HOME/.ssh/id_key -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
    export GIT_SSH_COMMAND
  clone.sh: |-
    #!/bin/sh
    set -eu
    . /scripts/ssh-env.sh

    # index-pack creates .git/objects/pack/tmp_pack_* with mode 0444 and then
    # reopens it for reading while still holding it open for writing. NFSv4
    # servers reject the second open, so fetching a thin pack dies with
    # "could not open '.git/objects/pack/tmp_pack_...' for reading: Permission
    # denied". Raising the unpack limit keeps incremental fetches on the
    # loose-object path, which writes, closes and only then reads. The initial
    # clone still uses index-pack so it lands as one pack, but it must run on
    # local disk first. Copying the packed repo onto the PVC avoids the NFS
    # reopen.
    git_safe() {
      git -C /data -c safe.directory=/data \
        -c fetch.unpackLimit={{ .Values.statamic.git.unpackLimit }} \
        -c transfer.unpackLimit={{ .Values.statamic.git.unpackLimit }} "$@"
    }

    # Workloads mount this PVC at /data/git. Files under .git do not dirty
    # the working tree. The revision stamp lets init.sh wait for THIS
    # release's clone, not a leftover checkout. The invalidate marker
    # tells PHP to rebuild the Redis Stache after reset/pull.
    finish_sync() {
      if [ -n "${RELEASE_REVISION:-}" ]; then
        printf '%s\n' "$RELEASE_REVISION" > /data/.git/statamic-clone-revision
      fi
      date -u +%Y-%m-%dT%H:%M:%SZ > /data/.git/statamic-stache-invalidate
    }

    if [ ! -d /data/.git ]; then
      if [ -n "${REPO_BRANCH:-}" ]; then
        git clone --branch "$REPO_BRANCH" --single-branch "$REPO_URL" /scratch/repo
      else
        git clone "$REPO_URL" /scratch/repo
      fi
      tar -C /scratch/repo -cf - . | tar -C /data -xf -
      rm -rf /scratch/repo
      finish_sync
      exit 0
    fi

    git_safe fetch origin

    commit_if_dirty() {
      git_safe add .
      if git_safe diff --quiet && git_safe diff --staged --quiet; then
        return 0
      fi
      echo "Committing local Statamic changes before pull."
      git_safe \
        -c user.name="$GIT_USER" \
        -c user.email="$GIT_EMAIL" \
        commit -m "$GIT_MESSAGE"
    }

    pull_origin() {
      if [ -n "${REPO_BRANCH:-}" ]; then
        git_safe pull --rebase origin "$REPO_BRANCH"
      else
        git_safe pull --rebase
      fi
    }

    if [ "${GIT_SYNC:-commit}" = "reset" ]; then
      # Staging: origin is source of truth. Discard unpublished PVC edits so
      # they cannot pin the volume behind origin.
      if [ -n "${REPO_BRANCH:-}" ]; then
        echo "Resetting working tree to origin/${REPO_BRANCH}."
        git_safe checkout -f -B "$REPO_BRANCH" "origin/$REPO_BRANCH"
      else
        echo "Resetting working tree to @{upstream}."
        git_safe reset --hard "@{upstream}"
      fi
      git_safe clean -fd
      finish_sync
      exit 0
    fi

    if [ "${GIT_SYNC:-commit}" = "commit" ]; then
      # Production / Forge: commit dirty content first so git pull --rebase
      # can run, then apply origin. Push stays with the CronJob / Statamic.
      commit_if_dirty
      if [ -n "${REPO_BRANCH:-}" ]; then
        current="$(git_safe rev-parse --abbrev-ref HEAD)"
        if [ "$current" != "$REPO_BRANCH" ]; then
          git_safe checkout "$REPO_BRANCH"
        fi
      fi
      pull_origin
      finish_sync
      exit 0
    fi

    if [ -n "${REPO_BRANCH:-}" ]; then
      current="$(git_safe rev-parse --abbrev-ref HEAD)"
      if [ "$current" != "$REPO_BRANCH" ]; then
        if [ -z "$(git_safe status --porcelain)" ]; then
          git_safe checkout -B "$REPO_BRANCH" "origin/$REPO_BRANCH"
        else
          echo "Working tree is dirty on ${current}; not switching to ${REPO_BRANCH}."
          finish_sync
          exit 0
        fi
      fi
    fi

    if [ -z "$(git_safe status --porcelain)" ]; then
      pull_origin
    else
      echo "Working tree is dirty; skipping pull to preserve local Statamic changes."
    fi
    finish_sync
  commit.sh: |-
    #!/bin/sh
    set -eu
    . /scripts/ssh-env.sh

    # See clone.sh for why the unpack limit is raised.
    git_safe() {
      git -C /data -c safe.directory=/data \
        -c fetch.unpackLimit={{ .Values.statamic.git.unpackLimit }} \
        -c transfer.unpackLimit={{ .Values.statamic.git.unpackLimit }} "$@"
    }

    if [ -z "$(git_safe status --porcelain)" ]; then
      echo "No Statamic content changes to commit."
      exit 0
    fi

    git_safe add .
    git_safe \
      -c user.name="$GIT_USER" \
      -c user.email="$GIT_EMAIL" \
      commit -m "$GIT_MESSAGE"
    git_safe pull --rebase
    git_safe push
{{- end }}
