{{- if and .Values.statamic.enabled (not (eq .Values.statamic.git.push false)) }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "laravel-app.fullname" . }}-git-commit
  labels:
    {{- include "laravel-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: statamic
spec:
  schedule: {{ .Values.statamic.schedule | quote }}
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.statamic.git.backoffLimit }}
      ttlSecondsAfterFinished: {{ .Values.statamic.git.ttlSecondsAfterFinished }}
      template:
        metadata:
          labels:
            {{- include "laravel-app.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: statamic-git-commit
            app.kubernetes.io/part-of: laravel-app
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            {{- toYaml .Values.statamic.git.podSecurityContext | nindent 12 }}
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumes:
          - name: ssh
            secret:
              secretName: {{ include "laravel-app.statamicSshSecretName" . }}
              defaultMode: 0440
              items:
              - key: id_key
                path: id_key
              - key: known_hosts
                path: known_hosts
          - name: data
            persistentVolumeClaim:
              claimName: {{ include "laravel-app.fullname" . }}-statamic-pvc
          - name: scripts
            configMap:
              name: {{ include "laravel-app.fullname" . }}-statamic-git-scripts
              defaultMode: 0550
          containers:
          - name: git-commit
            image: "{{ .Values.statamic.git.image.repository }}:{{ .Values.statamic.git.image.tag }}"
            imagePullPolicy: {{ .Values.statamic.git.image.pullPolicy }}
            securityContext:
              {{- toYaml .Values.statamic.git.containerSecurityContext | nindent 14 }}
            command: [/scripts/commit.sh]
            env:
            - name: GIT_USER
              value: {{ .Values.statamic.git.user | quote }}
            - name: GIT_EMAIL
              value: {{ .Values.statamic.git.email | quote }}
            - name: GIT_MESSAGE
              value: {{ .Values.statamic.git.message | quote }}
            - name: GIT_SSH_COMMAND
              value: ssh -i /git/.ssh/id_key -o IdentitiesOnly=yes -o UserKnownHostsFile=/git/.ssh/known_hosts
            volumeMounts:
            - name: data
              mountPath: /data
            - name: ssh
              mountPath: /git/.ssh
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
            resources:
              {{- toYaml .Values.statamic.git.resources | nindent 14 }}
          {{- with .Values.statamic.git.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.statamic.git.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.statamic.git.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
