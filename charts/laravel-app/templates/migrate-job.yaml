{{- if and (default true .Values.app.enabled) .Values.app.migrate.enabled (eq .Values.app.migrate.mode "hook") }}
{{- $podSecurityContext := mustMergeOverwrite (deepCopy (.Values.podSecurityContext | default dict)) (.Values.app.podSecurityContext | default dict) -}}
{{- $containerSecurityContext := mustMergeOverwrite (deepCopy (.Values.containerSecurityContext | default dict)) (.Values.app.containerSecurityContext | default dict) -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "laravel-app.fullname" . }}-migrate
  labels:
    {{- include "laravel-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.app.migrate.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.app.migrate.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "laravel-app.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
        app.kubernetes.io/part-of: laravel-app
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        {{- toYaml $podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
      - name: runtime-cache
        emptyDir:
          sizeLimit: {{ .Values.app.runtimeCache.sizeLimit | quote }}
      containers:
      - name: migrate
        image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.app.image.pullPolicy }}
        securityContext:
          {{- toYaml $containerSecurityContext | nindent 10 }}
        command: ["/bin/sh", "-c"]
        args:
        - {{ .Values.app.migrate.command | quote }}
        volumeMounts:
        - name: runtime-cache
          mountPath: {{ .Values.webRoot }}/bootstrap/cache
        {{- with .Values.existingEnvSecrets }}
        envFrom:
          {{- range . }}
          - secretRef:
              name: {{ . | quote }}
          {{- end }}
        {{- end }}
        {{- with .Values.envs }}
        env:
          {{- range $key, $value := . }}
          - name: {{ $key }}
            value: {{ $value | quote }}
          {{- end }}
        {{- end }}
        resources:
          {{- toYaml .Values.app.migrate.resources | nindent 10 }}
{{- end }}
