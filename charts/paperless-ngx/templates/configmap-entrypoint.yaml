apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "paperless-ngx.fullname" . }}-entrypoint
  labels:
    {{- include "paperless-ngx.labels" . | nindent 4 }}
data:
  entrypoint.sh: |
    #!/bin/bash
    set -euo pipefail

    {{- if .Values.redis.existingSecretPasswordKey }}
    : "${ {{- .Values.redis.existingSecretPasswordKey -}}:?{{ .Values.redis.existingSecretPasswordKey }} is required}"
    export PAPERLESS_REDIS="redis://:${ {{- .Values.redis.existingSecretPasswordKey -}} }@{{ .Values.redis.host }}:{{ .Values.redis.port }}"
    {{- end }}

    {{- if .Values.oidc.enabled }}
    : "${ {{- .Values.oidc.existingSecretKey -}}:?{{ .Values.oidc.existingSecretKey }} is required}"
    PAPERLESS_SOCIALACCOUNT_PROVIDERS="$(python3 <<'PY'
    import json, os
    print(json.dumps({
        "openid_connect": {
            "OAUTH_PKCE_ENABLED": {{ ternary "True" "False" .Values.oidc.pkce }},
            "APPS": [{
                "provider_id": {{ .Values.oidc.providerId | toJson }},
                "name": {{ .Values.oidc.name | toJson }},
                "client_id": {{ .Values.oidc.clientId | toJson }},
                "secret": os.environ[{{ .Values.oidc.existingSecretKey | toJson }}],
                "settings": {
                    "server_url": {{ .Values.oidc.serverUrl | toJson }},
                    "fetch_userinfo": True,
                },
            }],
            "SCOPE": {{ .Values.oidc.scopes | toJson }},
        }
    }))
    PY
    )"
    export PAPERLESS_SOCIALACCOUNT_PROVIDERS
    {{- end }}

    exec /init
