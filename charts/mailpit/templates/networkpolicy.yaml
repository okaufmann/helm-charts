{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mailpit.fullname" . }}
  labels:
    {{- include "mailpit.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mailpit.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mailpit
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        {{- toYaml .Values.networkPolicy.ingress.namespaceSelector | nindent 8 }}
      podSelector:
        {{- toYaml .Values.networkPolicy.ingress.podSelector | nindent 8 }}
    ports:
    - protocol: TCP
      port: {{ .Values.app.service.targetPort }}
  {{- with .Values.networkPolicy.smtp.from }}
  - from:
      {{- toYaml . | nindent 4 }}
    ports:
    - protocol: TCP
      port: {{ $.Values.app.service.smtp.targetPort }}
  {{- end }}
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  {{- if .Values.spamassassin.enabled }}
  - to:
    - podSelector:
        matchLabels:
          {{- include "mailpit.selectorLabels" . | nindent 10 }}
          app.kubernetes.io/component: spamassassin
    ports:
    - protocol: TCP
      port: {{ .Values.spamassassin.service.port }}
  {{- end }}
  {{- with .Values.networkPolicy.egress.additionalRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
